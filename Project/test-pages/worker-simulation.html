<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Worker Simulation - CryptoShield Test</title>
    <link rel="stylesheet" href="test-page.css">
</head>

<body class="quiet-test">
    <main class="page">
        <section class="panel">
            <a class="close-link" href="index.html" aria-label="Back to home">x</a>

            <p class="eyebrow">Simulation</p>
            <h1>Mining-like worker signal</h1>
            <p>This page creates a local worker after 12 seconds. The filename contains a mining keyword so the
                extension can detect the pattern.</p>
            <div id="status" class="status">Waiting to start worker...</div>
            <button id="stop-btn" type="button">Stop Worker</button>
        </section>
        <footer class="site-footer">CryptoShield | Malware Analysis Project | Designed and Developed by Areeba Adnan</footer>
    </main>

    <script>
        const statusBox = document.getElementById("status");
        const stopButton = document.getElementById("stop-btn");
        let worker = null;

        setTimeout(() => {
            worker = new Worker("miner-simulation-worker.js");
            statusBox.className = "status warn";
            statusBox.textContent = "Worker simulation started.";

            worker.addEventListener("message", (event) => {
                statusBox.textContent = `Worker simulation running. Iterations: ${event.data.iterations}`;
            });
        }, 12000);

        stopButton.addEventListener("click", () => {
            if (worker) {
                worker.terminate();
            }

            statusBox.className = "status safe";
            statusBox.textContent = "Worker stopped.";
        });
    </script>
</body>

</html>
