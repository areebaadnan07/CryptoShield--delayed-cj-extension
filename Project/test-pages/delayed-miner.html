<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delayed Miner - CryptoShield Test</title>
    <link rel="stylesheet" href="test-page.css">
</head>

<body class="quiet-test">
    <main class="page">
        <section class="panel">
            <a class="close-link" href="index.html" aria-label="Back to home">x</a>
            <p class="eyebrow">Delay-CJ Test</p>
            <h1>Delayed miner simulation</h1>
            <p>This page waits 5 seconds, then starts the worker. Use it to prove delayed cryptojacking detection.</p>
            <div id="status" class="status">Waiting 5 seconds before mining simulation...</div>
            <div id="load" class="status">Worker load: 0%</div>
            <button id="start-btn" type="button">Start Now</button>
            <button id="stop-btn" type="button">Stop Miner</button>
        </section>
        <footer class="site-footer">CryptoShield | Malware Analysis Project | Designed and Developed by Areeba Adnan</footer>
    </main>

    <script>
        const statusBox = document.getElementById("status");
        const loadBox = document.getElementById("load");
        const startButton = document.getElementById("start-btn");
        const stopButton = document.getElementById("stop-btn");
        let worker = null;
        let startTimer = null;
        let hashTimer = null;

        function startHashTelemetry() {
            if (hashTimer || !window.crypto?.subtle?.digest) {
                return;
            }

            const encoder = new TextEncoder();
            hashTimer = setInterval(() => {
                window.crypto.subtle.digest("SHA-256", encoder.encode(`delayed-miner-${Date.now()}`));
            }, 150);
        }

        function stopHashTelemetry() {
            clearInterval(hashTimer);
            hashTimer = null;
        }

        function startMining() {
            if (worker) {
                return;
            }

            clearTimeout(startTimer);
            worker = new Worker("miner-simulation-worker.js");
            statusBox.className = "status warn";
            statusBox.textContent = "Delayed miner simulation started.";
            loadBox.className = "status warn";
            loadBox.textContent = "Worker load: starting...";
            startHashTelemetry();

            worker.addEventListener("message", (event) => {
                statusBox.textContent = `Delayed miner simulation running. Iterations: ${event.data.iterations}`;
                loadBox.textContent = `Worker load: ${event.data.loadPercent}%`;
            });
        }

        startTimer = setTimeout(startMining, 5000);
        startButton.addEventListener("click", startMining);

        stopButton.addEventListener("click", () => {
            clearTimeout(startTimer);

            if (worker) {
                worker.postMessage("stop");
                worker.terminate();
                worker = null;
            }

            stopHashTelemetry();
            statusBox.className = "status safe";
            statusBox.textContent = "Delayed miner simulation stopped.";
            loadBox.className = "status safe";
            loadBox.textContent = "Worker load: 0%";
        });
    </script>
</body>

</html>
