<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CryptoShield</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #eef3f8;
            --panel: #ffffff;
            --ink: #16202a;
            --muted: #667789;
            --line: #d8e2ec;
            --safe: #1f9d68;
            --warn: #d97706;
            --danger: #d64545;
            --accent: #2563eb;
            --shadow: 0 18px 42px rgba(31, 45, 61, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 360px;
            min-height: 430px;
            margin: 0;
            color: var(--ink);
            font: 13px/1.45 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #f7fbff 0%, var(--bg) 100%);
        }

        .app {
            padding: 16px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .logo {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            border-radius: 8px;
            background: linear-gradient(145deg, #1f9d68, #2563eb);
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.24);
        }

        h1 {
            margin: 0;
            font-size: 18px;
            line-height: 1.1;
            letter-spacing: 0;
        }

        .subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        #status-badge {
            flex: 0 0 auto;
            padding: 6px 10px;
            color: #0f5132;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(31, 157, 104, 0.35);
            border-radius: 999px;
            background: rgba(31, 157, 104, 0.12);
        }

        #status-badge.warning {
            color: #92400e;
            border-color: rgba(217, 119, 6, 0.35);
            background: rgba(217, 119, 6, 0.12);
        }

        #status-badge.danger {
            color: #9f1d1d;
            border-color: rgba(214, 69, 69, 0.35);
            background: rgba(214, 69, 69, 0.12);
        }

        .panel {
            margin-bottom: 12px;
            padding: 14px;
            border: 1px solid rgba(216, 226, 236, 0.9);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: var(--shadow);
        }

        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: #415466;
        }

        .metric {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: end;
        }

        #cpu-value {
            font-size: 30px;
            font-weight: 800;
            line-height: 1;
        }

        .metric-note {
            color: var(--muted);
            font-size: 12px;
            text-align: right;
        }

        .graph-wrap {
            height: 112px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: linear-gradient(180deg, #fbfdff, #f3f7fb);
        }

        #cpu-graph {
            display: block;
            width: 100%;
            height: 90px;
        }

        .url-row {
            display: grid;
            grid-template-columns: 46px 1fr;
            gap: 10px;
            align-items: start;
            margin-bottom: 12px;
        }

        .label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        #current-url {
            min-width: 0;
            overflow-wrap: anywhere;
            color: #203040;
            font-weight: 650;
        }

        #flags-list {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #flags-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 7px;
            color: #33485c;
            background: #f8fbfe;
        }

        #flags-list li::before {
            content: "";
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--safe);
        }

        #flags-list li.warn::before {
            background: var(--warn);
        }

        #flags-list li.danger::before {
            background: var(--danger);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            width: 100%;
            min-height: 42px;
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, var(--danger), #a51d2d);
            box-shadow: 0 12px 24px rgba(214, 69, 69, 0.24);
        }

        button:hover {
            filter: brightness(1.04);
        }

        button:disabled {
            cursor: not-allowed;
            color: #758599;
            background: #dbe4ee;
            box-shadow: none;
        }

        .footer {
            color: var(--muted);
            font-size: 11px;
            text-align: center;
        }

        .signature {
            display: inline-block;
            margin-top: 8px;
            color: #415466;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div class="brand">
                <div class="logo" aria-hidden="true">C</div>
                <div>
                    <h1>CryptoShield</h1>
                    <div class="subtitle">Delayed cryptojacking monitor</div>
                </div>
            </div>
            <div id="status-badge">Checking</div>
        </header>

        <section class="panel" aria-labelledby="cpu-title">
            <div class="panel-title" id="cpu-title">
                <span>CPU Activity</span>
                <span id="cpu-value">0%</span>
            </div>
            <div class="metric-note" id="cpu-note">Normalized to one logical thread</div>
            <div class="graph-wrap">
                <canvas id="cpu-graph" width="308" height="90" aria-label="CPU usage graph"></canvas>
            </div>
        </section>

        <section class="panel" aria-labelledby="url-title">
            <div class="panel-title" id="url-title">Current Tab</div>
            <div class="url-row">
                <div class="label">URL</div>
                <div id="current-url">Loading...</div>
            </div>
            <ul id="flags-list">
                <li>Collecting tab signals...</li>
            </ul>
        </section>

        <div class="actions">
            <button id="block-btn" type="button" disabled>Block Tab</button>
        </div>
        <p class="footer">
            Blocks by closing the suspicious active tab.<br>
            <span class="signature">CryptoShield | Malware Analysis Project | Designed and Developed by Areeba Adnan</span>
        </p>
    </main>

    <script src="popup.js"></script>
</body>
</html>
